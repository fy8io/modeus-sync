name: Sync schedule

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: modeus-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sync/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r sync/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Sync Modeus -> gist
        env:
          TZ: Europe/Moscow
          MODEUS_STATE: ${{ secrets.MODEUS_STATE }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python sync/cloud_sync.py

      - name: Keep schedule alive
        if: always()
        run: |
          python - <<'PY'
          from datetime import date
          from pathlib import Path

          path = Path("sync/heartbeat.txt")
          today = date.today()
          old = path.read_text(encoding="utf-8").strip() if path.exists() else ""
          try:
              last = date.fromisoformat(old)
          except ValueError:
              last = None
          if last is None or (today - last).days >= 30:
              path.write_text(today.isoformat() + "\n", encoding="utf-8")
              print("heartbeat updated")
          else:
              print("heartbeat fresh")
          PY
          if ! git diff --quiet -- sync/heartbeat.txt; then
            git config user.name "modeus-sync"
            git config user.email "modeus-sync@users.noreply.github.com"
            git add sync/heartbeat.txt
            git commit -m "heartbeat $(date -u +%F)"
            git push
          fi
